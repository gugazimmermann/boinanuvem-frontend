# =============================================================================
# SonarQube Project Configuration
# =============================================================================
# This file configures SonarQube analysis for the Boinanuvem Frontend project.
# For security, sensitive values (token, host URL) should be provided via
# environment variables or CI/CD secrets, not hardcoded here.
# =============================================================================

# -----------------------------------------------------------------------------
# Project Identification
# -----------------------------------------------------------------------------
sonar.projectKey=Boinanuvem-Frontend
sonar.projectName=Boinanuvem Frontend
sonar.projectVersion=0.0.9

# -----------------------------------------------------------------------------
# SonarQube Server Configuration
# -----------------------------------------------------------------------------
# For local Docker setup (docker-compose.yml maps port 9001:9000)
# Note: sonar.organization is NOT required for local SonarQube (only for SonarCloud)
sonar.host.url=http://localhost:9001

# Authentication token (REQUIRED)
# Option 1 (Recommended): Set as environment variable before running sonar-scanner
#   export SONAR_TOKEN=your-token-here
#   npm run sonar
#
# Option 2: Uncomment and set the token directly below (less secure)
sonar.token=sqa_662ebf1081f0c2f84495120680c0a32639163b60
#
# To get a token:
# 1. Access http://localhost:9001
# 2. Login (default: admin/admin)
# 3. Go to My Account → Security → Generate Token
# 4. Copy the token and use it above
#
# For CI/CD, these can be set via environment variables:
# - SONAR_HOST_URL
# - SONAR_TOKEN

# -----------------------------------------------------------------------------
# Source Code Configuration
# -----------------------------------------------------------------------------
sonar.sources=app
sonar.sourceEncoding=UTF-8

# File suffixes for analysis
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# -----------------------------------------------------------------------------
# Test Configuration
# -----------------------------------------------------------------------------
sonar.tests=app
sonar.test.inclusions=**/__tests__/**/*.{ts,tsx},**/*.test.{ts,tsx},**/*.spec.{ts,tsx}

# -----------------------------------------------------------------------------
# Code Exclusions
# -----------------------------------------------------------------------------
# Files and directories excluded from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/coverage/**,\
  **/.react-router/**,\
  **/.scannerwork/**,\
  **/*.config.{js,ts},\
  **/*.d.ts,\
  **/types/**,\
  **/root.tsx,\
  **/app.css,\
  **/test-utils.ts,\
  **/vitest.setup.ts,\
  **/vitest.d.ts,\
  **/i18n/translations/*.ts,\
  **/mocks/**,\
  **/__tests__/**,\
  **/*.test.{ts,tsx},\
  **/*.spec.{ts,tsx},\
  **/index.ts,\
  **/index.tsx

# -----------------------------------------------------------------------------
# Test Exclusions
# -----------------------------------------------------------------------------
# Test files excluded from test analysis
sonar.test.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/coverage/**,\
  **/.react-router/**,\
  **/.scannerwork/**,\
  **/mocks/**,\
  **/index.ts,\
  **/index.tsx

# -----------------------------------------------------------------------------
# Coverage Configuration
# -----------------------------------------------------------------------------
# Coverage report paths (generated by Vitest with v8 provider)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Minimum test coverage threshold (70%)
sonar.coverage.minimum=70
sonar.javascript.coverage.minimum=70
sonar.typescript.coverage.minimum=70

# Files excluded from coverage calculation
sonar.coverage.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/coverage/**,\
  **/.react-router/**,\
  **/.scannerwork/**,\
  **/*.config.{js,ts},\
  **/*.d.ts,\
  **/types/**,\
  **/root.tsx,\
  **/app.css,\
  **/test-utils.ts,\
  **/vitest.setup.ts,\
  **/vitest.d.ts,\
  **/i18n/translations/*.ts,\
  **/i18n/index.ts,\
  **/__tests__/**,\
  **/*.test.{ts,tsx},\
  **/*.spec.{ts,tsx},\
  **/index.ts,\
  **/index.tsx

# -----------------------------------------------------------------------------
# Duplicate Code Detection
# -----------------------------------------------------------------------------
# Files excluded from duplicate code detection
sonar.cpd.exclusions=\
  **/node_modules/**,\
  **/build/**,\
  **/coverage/**,\
  **/.react-router/**,\
  **/.scannerwork/**,\
  **/i18n/translations/*.ts,\
  **/mocks/**,\
  **/types/**,\
  **/*.config.{js,ts},\
  **/__tests__/**,\
  **/*.test.{ts,tsx},\
  **/*.spec.{ts,tsx}

# Minimum number of tokens for duplicate detection
sonar.cpd.minimumtokens=50

# -----------------------------------------------------------------------------
# Issue Management
# -----------------------------------------------------------------------------
# Ignore specific rules for specific files/paths
# e1: Ignore random number generation in mocks (typescript:S2245)
# e2: Ignore function complexity in specific route files (*:S138)
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=**/mocks/**
sonar.issue.ignore.multicriteria.e2.ruleKey=*:S138
sonar.issue.ignore.multicriteria.e2.resourceKey=**/animals.$animalId.tsx

# -----------------------------------------------------------------------------
# Additional Analysis Settings
# -----------------------------------------------------------------------------
# Enable analysis cache for faster subsequent scans
sonar.scanner.force-deprecated-java-version=false

# -----------------------------------------------------------------------------
# Notes
# -----------------------------------------------------------------------------
# 1. This configuration is for LOCAL SonarQube (Docker) - sonar.organization is NOT required
# 2. Ensure coverage reports are generated before running SonarQube analysis
# 3. Run: npm run test:coverage && sonar-scanner
# 4. For SonarCloud (cloud version), you would need to:
#    - Set sonar.host.url=https://sonarcloud.io
#    - Add sonar.organization=your-org-key
#    - Use: sonar-scanner -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=your-org-key
